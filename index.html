<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1EFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14172A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<title>Golf Reventa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<!-- Aspecto nuevo (Fase 3): solo actúa con <html data-look="nuevo">. Con «clásico» la app queda como antes. -->
<link rel="stylesheet" href="look.css">
<script>
/* Antes de pintar nada: aspecto, paleta y tipografía de cifras elegidos en este dispositivo */
(function () {
  try {
    var d = document.documentElement, g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var look = 'nuevo', tipo = g('tipo') || 'bricolage'; // el aspecto «Clásico» está oculto desde el 17/10/2026
    d.setAttribute('data-look', look); d.setAttribute('data-paleta', g('paleta') || 'violeta'); d.setAttribute('data-tipo', tipo);
    var F = { space: 'Space+Grotesk:wght@500..700', outfit: 'Outfit:wght@500..700', nunito: 'Nunito:wght@600..900' };
    if (look === 'nuevo' && F[tipo]) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=' + F[tipo] + '&display=swap'; document.head.appendChild(l); }
  } catch (e) { /* sin almacenamiento: aspecto nuevo por defecto */ }
})();
</script>
</head>
<body>
<div id="app"></div>

<!-- Librería cliente de Supabase (pública, no es ningún secreto) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Tu URL y clave pública de Supabase. Copia config.example.js -> config.js y rellénalo. -->
<script src="config.js"></script>

<!-- Capa de datos (adaptador a Supabase) y lógica de la app -->
<script src="data-layer.js"></script>
<script src="app.js"></script>
<script src="auth-signup.js"></script>
</body>
</html>
