<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1EFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14172A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PalomApp">
<title>PalomApp</title>
<link rel="icon" href="marca/icono.svg" type="image/svg+xml">
<link rel="icon" href="marca/icono-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="marca/icono-180.png">
<link rel="preload" href="fonts/work-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css"><!-- 11/11: letras dentro de la app (antes, de Google: con mala red, pantalla en blanco) -->
<link rel="stylesheet" href="app.css">
<!-- Aspecto nuevo (Fase 3): solo actúa con <html data-look="nuevo">. Con «clásico» la app queda como antes. -->
<link rel="stylesheet" href="look.css">
<script>
/* Antes de pintar nada: aspecto, paleta y tipografía de cifras elegidos en este dispositivo */
(function () {
  try {
    var d = document.documentElement, g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var look = 'nuevo', tipo = g('tipo') || 'bricolage'; // el aspecto «Clásico» está oculto desde el 17/10/2026
    var th = g('theme'); if (th === 'light' || th === 'dark') d.setAttribute('data-theme', th); // 08/11: el tema elegido, antes de pintar (sin destello)
    if (g('cifrasOcultas') === '1') d.classList.add('cifras-ocultas');
    d.setAttribute('data-look', look); d.setAttribute('data-paleta', g('paleta') || 'violeta'); d.setAttribute('data-tipo', tipo);
    var F = { fraunces: 'Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700', space: 'Space+Grotesk:wght@500..700', outfit: 'Outfit:wght@500..700', nunito: 'Nunito:wght@600..900' };
    if (look === 'nuevo' && F[tipo]) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=' + F[tipo] + '&display=swap'; document.head.appendChild(l); }
  } catch (e) { /* sin almacenamiento: aspecto nuevo por defecto */ }
})();
</script>
</head>
<body>
<div id="app"></div>

<!-- Librería cliente de Supabase (pública, no es ningún secreto) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

<!-- Tu URL y clave pública de Supabase. Copia config.example.js -> config.js y rellénalo. -->
<script src="config.js"></script>

<!-- Idiomas (español / inglés): traduce lo que se pinta cuando la app está en inglés. Con español no hace nada. -->
<script src="i18n.js"></script>

<!-- Capa de datos (adaptador a Supabase) y lógica de la app -->
<script src="data-layer.js"></script>
<script src="app.js"></script>
<script src="captcha.js"></script>
<script src="auth-signup.js"></script>
</body>
</html>
