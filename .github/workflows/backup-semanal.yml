# Copia de seguridad DIARIA de la base de datos de Supabase (13/11: antes semanal y sin las cuentas).
# - Se ejecuta sola cada noche (y a mano desde la pestaña Actions).
# - Incluye los datos de la app (public) y las cuentas (auth): sin ellas, tras un desastre los datos quedarían sin dueño.
# - Cada vez hace un SIMULACRO: restaura la copia en una base de datos vacía y cuenta las filas.
# - El archivo se CIFRA con una contraseña tuya antes de guardarse, así que aunque el repositorio
#   fuese público nadie podría leerlo.
# - Se guarda como "artefacto" de GitHub durante 90 días (verás las últimas ~12 copias).
name: Copia de seguridad diaria

on:
  schedule:
    - cron: '17 3 * * *'   # cada día 03:17 UTC
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/backup-semanal.yml'   # se ejecuta también al editar este archivo (sirve para probarla)

jobs:
  backup:
    runs-on: ubuntu-latest
    services:
      prueba:   # base de datos vacía para el simulacro de restauración
        image: postgres:17
        env: { POSTGRES_PASSWORD: simulacro }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17

      - name: Volcar la base de datos (datos de la app y cuentas)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Falta el secreto SUPABASE_DB_URL"; exit 1; }
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges -f backup.sql
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --data-only --table=auth.users --table=auth.identities --no-owner --no-privileges -f cuentas.sql
          test -s backup.sql && test -s cuentas.sql
          echo "Tablas en el volcado: $(grep -c '^COPY ' backup.sql) + cuentas: $(grep -c '^COPY ' cuentas.sql)"

      - name: Simulacro de restauración (base vacía)
        env:
          PGPASSWORD: simulacro
        run: |
          set -uo pipefail
          P="/usr/lib/postgresql/17/bin/psql -h localhost -U postgres -q"
          # lo mínimo de Supabase para que entre la copia: esquema auth, roles y auth.uid()
          $P -c "create role anon; create role authenticated; create role service_role; create schema auth; create schema extensions;
                 create table auth.users (id uuid primary key); create function auth.uid() returns uuid language sql as 'select null::uuid';
                 create function auth.role() returns text language sql as 'select null::text'; create function auth.jwt() returns jsonb language sql as 'select null::jsonb';" >/dev/null
          $P -f backup.sql > restaurar.log 2>&1 || true
          echo "Errores al restaurar (normales los de extensiones o roles de Supabase): $(grep -c ERROR restaurar.log)"
          for t in movimientos config tareas compartidos grupos; do
            n=$($P -tA -c "select count(*) from public.$t" 2>/dev/null || echo FALLA)
            echo "  $t: $n filas restauradas"
            [ "$n" = "FALLA" ] && { echo "El simulacro no pudo restaurar $t"; exit 1; }
          done
          true

      - name: Cifrar
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PASS" || { echo "Falta el secreto BACKUP_PASSPHRASE"; exit 1; }
          cat cuentas.sql >> backup.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "backup-$(date -u +%F).sql.gpg" backup.sql
          rm -f backup.sql cuentas.sql restaurar.log
          ls -la

      - name: Comprobar que la copia se puede abrir y tiene datos
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          f=$(ls backup-*.sql.gpg)
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" -d "$f" > verificacion.sql
          echo "Filas guardadas en la copia, por tabla:"
          awk '/^COPY /{t=$2; n=0; inside=1; next} /^\\\.$/{if(inside){print "  " t ": " n; inside=0}; next} inside{n++}' verificacion.sql
          rm -f verificacion.sql

      - name: Guardar copia (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: backup-supabase-${{ github.run_number }}
          path: backup-*.sql.gpg
          retention-days: 30
          if-no-files-found: error

      # Copia también en un repositorio PRIVADO si el dueño lo ha preparado (secretos COPIAS_REPO = usuario/repositorio
      # y COPIAS_TOKEN = token con permiso de escritura solo en ese repositorio). Si no están, se salta.
      - name: Guardar en el repositorio privado (si está preparado)
        env:
          REPO: ${{ secrets.COPIAS_REPO }}
          TOKEN: ${{ secrets.COPIAS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${REPO:-}" ] || [ -z "${TOKEN:-}" ]; then echo "Sin repositorio privado: se guarda solo en GitHub Actions"; exit 0; fi
          f=$(ls backup-*.sql.gpg)
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" privado
          mkdir -p privado/copias && cp "$f" privado/copias/
          cd privado && ls -1t copias/*.gpg | tail -n +31 | xargs -r git rm -q   # se quedan las 30 últimas
          git add copias && git -c user.name=copia -c user.email=copia@users.noreply.github.com commit -qm "Copia $(date -u +%F)" && git push -q
