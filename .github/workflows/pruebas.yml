# Pasa las pruebas en cada rama al subir cambios (12/11/2026). No publica nada.
name: Pruebas
on:
  push:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Pruebas de la web (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node -e "new Function(require('fs').readFileSync('app.js','utf8'))"
      - run: cd tests && npm ci || npm install
      - run: cd tests && node run.js --j=4
  lector:
    name: Pruebas del lector de avisos (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: cd movil && npm ci || npm install
      - run: cd movil && npm run sync
      - run: cd movil/android && chmod +x gradlew && ./gradlew -q testDebugUnitTest
